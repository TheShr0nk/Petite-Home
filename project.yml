# XcodeGen spec. Run `xcodegen generate` (brew install xcodegen) to produce
# PetiteHome.xcodeproj. The project file is not committed; this spec is.
name: PetiteHome
options:
  bundleIdPrefix: co.petitehome
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""            # set your team
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"      # iPhone only in v1
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"
targets:
  PetiteHome:
    type: application
    platform: iOS
    sources:
      - path: PetiteHome
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: PetiteHome/Resources/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.petitehome.app
        INFOPLIST_FILE: PetiteHome/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PetiteHome/Resources/PetiteHome.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: PostHog
        product: PostHog
    scheme:
      testTargets:
        - PetiteHomeTests
      storeKitConfiguration: PetiteHome/Resources/Products.storekit
  PetiteHomeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PetiteHomeTests
    dependencies:
      - target: PetiteHome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.petitehome.app.tests
